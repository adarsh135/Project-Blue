name: BLUE CI
on:
  push:
    branches:
      - main
      - 'release/**'
      - 'blue/**'
      - 'byok/**'
      - 'arena/**'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Node.js 22 tests and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Check JavaScript syntax
        run: find server api public/js tests -name '*.js' -print0 | xargs -0 -n1 node --check
